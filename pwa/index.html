<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10151f">
  <meta name="description" content="Configurazione BLE del Robottino">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <title>Robottino BLE</title>
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div>
        <span class="eyebrow">CONFIGURAZIONE BLE</span>
        <h1>Robottino</h1>
        <p>Configura rete, posizione e orologio dal telefono.</p>
      </div>
      <div class="status-dot" id="connectionDot" aria-label="Non connesso"></div>
    </header>

    <section class="panel">
      <div class="panel-heading"><span>01</span><h2>Accesso</h2></div>
      <label for="pin">PIN del robottino</label>
      <input id="pin" type="password" inputmode="numeric" maxlength="4" placeholder="1234" autocomplete="off">
      <p class="hint">Il PIN viene verificato direttamente dall'ESP32.</p>
    </section>

    <section class="panel">
      <div class="panel-heading"><span>02</span><h2>Rete Wi-Fi</h2></div>
      <label for="ssid">SSID</label>
      <input id="ssid" list="savedNetworks" placeholder="Nome della rete">
      <datalist id="savedNetworks"></datalist>
      <label for="wifiPassword">Password Wi-Fi</label>
      <input id="wifiPassword" type="password" placeholder="Password della rete">
    </section>

    <section class="panel split">
      <div>
        <div class="panel-heading"><span>03</span><h2>Posizione</h2></div>
        <p id="locationText" class="value">Non rilevata</p>
        <button class="button secondary" id="locationButton">Rileva posizione GPS</button>
      </div>
      <div>
        <div class="panel-heading"><span>04</span><h2>Ora</h2></div>
        <p class="value" id="timeText">Non sincronizzata</p>
        <button class="button secondary" id="timeButton">Sincronizza ora locale</button>
      </div>
    </section>

    <button class="button primary" id="sendButton">Connetti e invia configurazione</button>
    <p class="feedback" id="feedback" role="status"></p>
    <p class="footer">Servizio BLE: <code>7f7b0001-8b3a-4f65-9d39-2c8c5a7e1001</code></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
